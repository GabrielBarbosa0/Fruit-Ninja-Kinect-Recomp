[main]
# Paths are resolved relative to this file. Game data and generated output are
# intentionally excluded from source control.
file_path = "../artifacts/extracted/fruit-ninja-kinect/default.xex"
out_directory_path = "../generated/ppc"
switch_table_file_path = "../generated/analysis/FNK_switch_tables.toml"

# Keep all optimizations disabled until the first correct native boot.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler save/restore fallthrough helpers, recovered from the decrypted XEX
# using XenonRecomp's documented instruction signatures.
restgprlr_14_address = 0x823B8740
savegprlr_14_address = 0x823B86F0
restfpr_14_address = 0x823B973C
savefpr_14_address = 0x823B96F0
restvmx_14_address = 0x823B9A28
savevmx_14_address = 0x823B9790
restvmx_64_address = 0x823B9ABC
savevmx_64_address = 0x823B9824
